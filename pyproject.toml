[project]
name = "prefecture"
version = "0.1.0"
description = "A Prefect-based system for simple regular data processing jobs (with initial focus on automating AI-generated weekly digests)."
requires-python = ">=3.10"
dependencies = [
    "prefect>=3.0.0",
    "google-genai",
    "Jinja2",
    "markdown",
    "premailer",
    "requests",
    "python-dotenv",
    "pytest",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "python-slugify",
    "sqlalchemy",
]

[project.scripts]
prefecture = "prefecture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
